name: Frontend CI

on:
  # No path filter on pull requests: these are required checks (NF-F0-010), and a required check
  # that does not run leaves a docs-only pull request waiting forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    # The name is what branch protection lists, so it must differ from every other job's.
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Placeholders: nothing is deployed here. The build and the tests both read them.
    env:
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: nomadfinance-prod.web.app
      VITE_FIREBASE_PROJECT_ID: nomadfinance-prod
      VITE_FIREBASE_APP_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

      # Unit tests, with the coverage floors set in vite.config.ts (D-46: they never ran in CI).
      - name: Unit tests with coverage
        run: pnpm test:coverage

      # Type-checks (tsc -b) and builds.
      - name: Build
        run: pnpm build

  # Firestore and Storage security rules, against the local emulators.
  rules:
    name: Frontend rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # test:rules in package.json calls a global `firebase`; a fresh runner has none.
      - run: npm install --global firebase-tools@15.31.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:rules
