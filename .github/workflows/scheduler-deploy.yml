name: Cloud Scheduler deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/cloud-scheduler/**"
      - ".github/workflows/scheduler-deploy.yml"
  workflow_dispatch:

concurrency:
  group: scheduler-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/54982290462/locations/global/workloadIdentityPools/github/providers/github
          service_account: nomadfinance-deploy-infra@nomadfinance-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # One job per file, named after it. An empty file is a placeholder for a later task.
      # Every job wants the same Content-Type header (the endpoints all take an empty JSON
      # body); it's set here rather than in each file because gcloud names the flag
      # differently for create (--headers) and update (--update-headers), and one
      # flags-file shared by both commands can't carry a flag name that only one accepts.
      - name: Create or update the jobs
        run: |
          for file in infra/cloud-scheduler/*.yaml; do
            if [ ! -s "$file" ]; then
              echo "skip $file (empty)"
              continue
            fi
            name="$(basename "$file" .yaml)"
            if gcloud scheduler jobs describe "$name" --project nomadfinance-prod --location asia-south1 > /dev/null 2>&1; then
              echo "update $name"
              gcloud scheduler jobs update http "$name" --flags-file="$file" --update-headers=Content-Type=application/json
            else
              echo "create $name"
              gcloud scheduler jobs create http "$name" --flags-file="$file" --headers=Content-Type=application/json
            fi
          done

      - name: Show the result
        run: gcloud scheduler jobs list --project nomadfinance-prod --location asia-south1
