  <g transform="translate(32 32) scale(0.78) translate(-32 -32)">
    <path
      d="M20 46 L20 18 L44 46 L44 18"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="44" cy="18" r="5" fill="#F59E0B" />
  </g>
</svg>
