<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Financial protection for migrant workers." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Brand primary "Nomad Teal" (NF-P1-024) -->
    <meta name="theme-color" content="#0B5D71" />
    <!-- Applies the dark class before first paint, so there is no flash of the wrong theme
         while React loads (NF-P2-023). Keep "nomadfinance.theme" in sync with THEME_KEY in
         src/lib/theme.ts; ThemeSync re-applies this once React is running. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nomadfinance.theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          // Local storage or matchMedia unavailable: stays in the default light theme.
        }
      })();
    </script>
    <!-- iOS ignores the web manifest for standalone mode; these are required separately. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NomadFinance" />
    <!-- iOS-only launch splash screens (NF-P1-024), one per device size/pixel-ratio. Generated
         by scripts/generate-brand-assets.sh; regenerate both together if sizes ever change. -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-640-1136.png"
      media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-750-1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-828-1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-1125-2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-1170-2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-1179-2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-1242-2688.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-1284-2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-1536-2048.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-1668-2388.png"
      media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-2048-2732.png"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <title>NomadFinance</title>
    <!-- Painted by the HTML alone, before any script runs. On a slow connection the app's
         code takes seconds to arrive, and this is what the worker sees meanwhile instead of
         a blank page (NF-P4-003). React replaces #root's contents on its first render.
         Colours match tokens.css (--background) because that file has not loaded yet. -->
    <style>
      #root > .boot {
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #fff;
        color: #0b5d71;
        font:
          600 18px/1.2 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .dark #root > .boot {
        background: hsl(199 35% 7%);
        color: #e6f1f4;
      }
      #root > .boot svg {
        width: 56px;
        height: 56px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="NomadFinance">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="12" fill="#0B5D71" />
          <path
            d="M20 46 L20 18 L44 46 L44 18"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="44" cy="18" r="5" fill="#F59E0B" />
        </svg>
        NomadFinance
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
