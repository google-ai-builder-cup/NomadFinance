# Cloud Scheduler job: recompute every worker's Financial Identity profile (metrics and
# narrative) into users/{uid}/financial_profile/current (NF-P3-013).
#
# Create (once):   gcloud scheduler jobs create http fib-recompute --flags-file=infra/cloud-scheduler/fib-recompute.yaml --headers=Content-Type=application/json
# Apply a change:  gcloud scheduler jobs update http fib-recompute --flags-file=infra/cloud-scheduler/fib-recompute.yaml --update-headers=Content-Type=application/json
# Run now:         gcloud scheduler jobs run fib-recompute --project nomadfinance-prod --location asia-south1
#
# The Content-Type header is set by scheduler-deploy.yml, not here: `create` and `update`
# need different flag names for it (--headers vs --update-headers), so one flags-file used
# by both commands can't carry it without breaking one of them.
#
# To change how often it runs, edit --schedule only (cron syntax, UTC), then "Apply a change".
# Each run calls the reasoning tier once per worker with activity (about 15 to 25 s each, 3 at
# a time), so running it daily instead of weekly would cost seven times the quota.

--project: nomadfinance-prod
--location: asia-south1
# Sundays 02:00 UTC.
--schedule: "0 2 * * 0"
--time-zone: Etc/UTC
--description: "Recompute Financial Identity profiles: metrics and narrative (NF-P3-013)"
--uri: https://nomadfinance-api-azewstzfaa-el.a.run.app/api/v1/internal/recompute-fib-profiles
--http-method: POST
# Google's front end rejects a POST without Content-Length (411); an empty JSON body avoids it.
--message-body: "{}"
# The endpoint accepts only an OIDC token for this service account and audience; they must
# match CRON_SERVICE_ACCOUNT and CRON_AUDIENCE on the Cloud Run service (deploy_manual.sh).
--oidc-service-account-email: nomadfinance-scheduler@nomadfinance-prod.iam.gserviceaccount.com
--oidc-token-audience: https://nomadfinance-api-azewstzfaa-el.a.run.app
# Cloud Run's request timeout is 900 s (deploy_manual.sh), so a longer deadline here would
# only wait for a request that is already gone.
--attempt-deadline: 900s
# The endpoint answers 200 even when a worker's profile failed (that worker keeps last week's
# profile), so a retry only happens for a real failure of the call itself, and then once.
--max-retry-attempts: 1
--min-backoff: 300s
